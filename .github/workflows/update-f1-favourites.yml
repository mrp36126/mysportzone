name: Update F1 Favourites

on:
  workflow_dispatch:
  schedule:
    # Times are UTC. They target daily checks plus common F1 session windows
    # in SAST (UTC+2): after FP1, FP2, FP3, qualifying, and race-morning.
    - cron: "0 6 * * *"
    - cron: "15 12 * * 5"
    - cron: "45 15 * * 5"
    - cron: "15 11 * * 6"
    - cron: "45 14 * * 6"
    - cron: "0 8 * * 0"

concurrency:
  group: update-f1-favourites
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-f1-favourites:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY GitHub secrets are required."
            exit 1
          fi

      - name: Refresh F1 favourites cache
        run: npm run update:f1-favourites
