name: Update F1 Session Results

on:
  workflow_dispatch:
  schedule:
    # Times are UTC. These warm the Vercel API cache shortly after common
    # F1 session windows in SAST (UTC+2), including sprint weekends.
    - cron: "50 12 * * 5"
    - cron: "20 16 * * 5"
    - cron: "50 11 * * 6"
    - cron: "20 15 * * 6"
    - cron: "30 16 * * 0"

concurrency:
  group: update-f1-session-results
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-f1-session-results:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Refresh latest F1 session result endpoint
        run: |
          SITE_URL="${{ vars.SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://mysportzone.vercel.app"
          fi

          curl --fail --show-error --silent "$SITE_URL/api/f1-latest-session" > /tmp/f1-latest-session.json
          cat /tmp/f1-latest-session.json

      - name: Refresh F1 favourites cache
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY GitHub secrets are required."
            exit 1
          fi

          npm run update:f1-favourites
