name: Update F1 Results

on:
  workflow_dispatch:
  schedule:
    # Poll through and after race weekends so late-published classifications
    # still update automatically without waiting for manual intervention.
    - cron: "*/30 * * * 5,6,0,1,2"

concurrency:
  group: update-f1-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-f1-results:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run F1 updater
        run: npm run update:f1

      - name: Commit updated CSV files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update F1 results and standings"
          file_pattern: "data/f1_results.csv data/f1_sprint_results.csv data/f1_drivers.csv data/f1_constructors.csv"
